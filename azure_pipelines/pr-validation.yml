# Publish once: parallel platform publishers overwrite the native HTML index.
- template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
  parameters:
    jobName: Publish_coverage
    displayName: Publish Common Core coverage
    dependsOn: [Validate_Pull_Request_iOS, Validate_Pull_Request_macOS]
    condition: succeededOrFailed()
    selectXcode: false
    installSlather: false
    installCocoaPods: false
    installXcpretty: false
    installBundler: false
    installXcbeautify: false
    steps:
      - checkout: self
        clean: true
      - task: DownloadPipelineArtifact@2
        displayName: Download scheme coverage reports
        inputs:
          buildType: current
          itemPattern: '**/*.cobertura.xml'
          targetPath: '$(Build.SourcesDirectory)/build/coverage/reports'
      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Prepare and verify all published schemes
        inputs:
          targetType: inline
          # Keep handoff XML unchanged; native publication must trust this checkout.
          script: ruby scripts/coverage.rb prepare-publication build/coverage/reports build/coverage/publication-reports
      # Completeness failure keeps the job failed; still publish valid inputs.
      - task: PublishCodeCoverageResults@2
        condition: succeededOrFailed()
        displayName: Publish code coverage
        inputs:
          summaryFileLocation: '$(Build.SourcesDirectory)/build/coverage/publication-reports/*.cobertura.xml'
          pathToSources: '$(Build.SourcesDirectory)'
          failIfCoverageEmpty: true
      # Downloadable platform views use the same XMLs, after native publication.
      - task: UseDotNet@2
        condition: succeededOrFailed()
        displayName: Set up platform HTML report runtime
        inputs:
          packageType: sdk
          version: '8.x'
      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Restore pinned HTML report generator
        inputs:
          targetType: inline
          script: dotnet tool restore --tool-manifest .config/dotnet-tools.json
      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Generate iOS coverage HTML
        inputs:
          targetType: inline
          script: |
            dotnet tool run reportgenerator -- \
              "-reports:build/coverage/publication-reports/IdentityCore_iOS.cobertura.xml" \
              "-targetdir:build/coverage/html/iOS" \
              "-sourcedirs:$PWD" \
              "-reporttypes:Html" \
              "-title:Common Core iOS coverage"
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        displayName: Publish iOS coverage HTML
        inputs:
          targetPath: '$(Build.SourcesDirectory)/build/coverage/html/iOS'
          artifact: 'Common Core iOS coverage HTML - $(System.JobAttempt)'
      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Generate macOS coverage HTML
        inputs:
          targetType: inline
          script: |
            dotnet tool run reportgenerator -- \
              "-reports:build/coverage/publication-reports/IdentityCore_Mac.cobertura.xml" \
              "-targetdir:build/coverage/html/macOS" \
              "-sourcedirs:$PWD" \
              "-reporttypes:Html" \
              "-title:Common Core macOS coverage"
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        displayName: Publish macOS coverage HTML
        inputs:
          targetPath: '$(Build.SourcesDirectory)/build/coverage/html/macOS'
          artifact: 'Common Core macOS coverage HTML - $(System.JobAttempt)'
      # Warning-only floors: floor(run1717201 measured percent) - 2 points.
      # iOS 25322/34315 => 71%; macOS 23186/35657 => 63%; use same-run XML counts.
      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Check iOS coverage baseline (warning only)
        inputs:
          targetType: inline
          script: |
            python3 scripts/check_coverage_baseline.py \
              --report "build/coverage/publication-reports/IdentityCore_iOS.cobertura.xml" \
              --suite "IdentityCore iOS" --minimum 71 \
              --revision "$(Build.SourceVersion)"
      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Check macOS coverage baseline (warning only)
        inputs:
          targetType: inline
          script: |
            python3 scripts/check_coverage_baseline.py \
              --report "build/coverage/publication-reports/IdentityCore_Mac.cobertura.xml" \
              --suite "IdentityCore Mac" --minimum 63 \
              --revision "$(Build.SourceVersion)"
