# visionOS test-runner DIAGNOSTICS pipeline  (EXPERIMENT — scratch branch only)
#
# Purpose: production visionOS validation is build-only because xcodebuild hangs
# launching the test host into the visionOS simulator. This scratch pipeline
# deliberately RE-ENABLES the visionOS unit tests, but:
#   * bounds the run with a portable wall-clock timeout so it can never sit at the
#     job's 40-minute limit, and
#   * always() collects simulator + crash + build logs and publishes them as a
#     build artifact, so we finally get the real failure reason instead of a
#     silent 60-minute hang.
#
# It reuses the same governed ACES macOS job template and the same
# download-visionos-sdk.yml template as the production pipeline, so what it
# reproduces matches prod. It does NOT modify visionos-validation.yml and only
# runs when triggered manually (trigger: none), so production CI stays green.
#
# To use: point a scratch ADO pipeline definition at this file on the
# mipetriu-visionos-test-diagnostics branch and queue it manually.

trigger: none
pr: none

resources:
  repositories:
  # Shared ACES macOS job template (pool + Xcode + tool setup) — source of truth,
  # identical to the production visionos-validation.yml.
  - repository: pipelinesShared
    type: git
    name: IDDP/MSAL-ObjC-Pipelines
    ref: refs/heads/main

stages:
- stage: Stage_IdentityCore_VisionOS_Diagnostics
  displayName: "IdentityCore visionOS test diagnostics"
  dependsOn: []
  jobs:
  - template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
    parameters:
      jobName: Diagnose_IdentityCore_VisionOS_Tests
      displayName: IdentityCore vision_library_test (diagnostics)
      # Hard ceiling. The inner wall-clock timeout (below) fires first at 20 min;
      # this only guards against the surrounding steps wedging.
      timeoutInMinutes: 40
      steps:
      - checkout: self
        clean: true
        submodules: true
        fetchDepth: 1
        persistCredentials: false

      - task: Bash@3
        displayName: Removing any lingering codecov files
        inputs:
          targetType: 'inline'
          script: |
            find . -name "*.gcda" -print0 | xargs -0 rm

      - template: /azure_pipelines/templates/download-visionos-sdk.yml

      - task: Bash@3
        displayName: Resolve & boot Apple Vision Pro simulator (blocking)
        inputs:
          targetType: 'inline'
          script: |
            set -euo pipefail
            echo "Available visionOS devices:"
            xcrun simctl list devices available | grep -i "Vision Pro" || true

            UDID=$(xcrun simctl list devices available \
              | grep -i "Apple Vision Pro" \
              | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}" \
              | head -1)

            if [ -z "$UDID" ]; then
              echo "##[error]Could not resolve an available Apple Vision Pro simulator UDID." >&2
              exit 1
            fi
            echo "Resolved Apple Vision Pro UDID: $UDID"

            # Block until the device reports fully booted (or fail fast) instead of
            # the fire-and-forget boot build.py does. bootstatus -b boots if needed.
            echo "Booting and waiting for boot to complete..."
            xcrun simctl bootstatus "$UDID" -b

            echo "Booted device state:"
            xcrun simctl list devices | grep -i "Apple Vision Pro" || true

            # Hand the UDID to later steps.
            echo "##vso[task.setvariable variable=visionUDID]$UDID"

      - task: Bash@3
        displayName: Run CPP script
        inputs:
          targetType: 'inline'
          script: |
            python3 ./scripts/update_xcode_config_cpp_checks.py
          failOnStderr: true

      - task: Bash@3
        displayName: Run visionOS tests (wall-clock bounded)
        inputs:
          targetType: 'inline'
          script: |
            set +e

            # Portable wall-clock timeout. GNU `timeout` is not guaranteed on the
            # macOS agent, so use perl (always present). It runs the command in its
            # OWN process group and, on expiry, signals the whole group so the
            # child xcodebuild is terminated too — not just build.py.
            run_bounded() {
              local secs="$1"; shift
              perl -e '
                my $t = shift @ARGV;
                my $pid = fork();
                if ($pid == 0) { setpgrp(0,0); exec @ARGV or die "exec failed: $!"; }
                local $SIG{ALRM} = sub {
                  kill("-TERM", $pid); sleep 10; kill("-KILL", $pid); exit 124;
                };
                alarm $t;
                waitpid($pid, 0);
                exit($? >> 8);
              ' "$secs" "$@"
            }

            TEST_TIMEOUT=1200
            echo "Running: ./build.py --no-clean --target vision_library_test  (cap ${TEST_TIMEOUT}s)"
            run_bounded "$TEST_TIMEOUT" ./build.py --no-clean --target vision_library_test
            RC=$?

            if [ "$RC" -eq 124 ]; then
              echo "##[warning]visionOS test run hit the ${TEST_TIMEOUT}s wall-clock cap (the host-launch hang reproduced)."
            else
              echo "visionOS test run exited with code ${RC}."
            fi

            # Never fail here — the diagnostics + publish steps must always run.
            # The exit code is surfaced in the summary step instead.
            echo "##vso[task.setvariable variable=visionTestRC]$RC"
            exit 0

      - task: Bash@3
        condition: always()
        displayName: Collect simulator & crash diagnostics
        inputs:
          targetType: 'inline'
          script: |
            set +e
            DIAG_DIR="$(Build.ArtifactStagingDirectory)/visionos-diagnostics"
            mkdir -p "$DIAG_DIR"

            run_bounded() {
              local secs="$1"; shift
              perl -e '
                my $t = shift @ARGV;
                my $pid = fork();
                if ($pid == 0) { setpgrp(0,0); exec @ARGV or die "exec failed: $!"; }
                local $SIG{ALRM} = sub { kill("-TERM", $pid); sleep 5; kill("-KILL", $pid); exit 124; };
                alarm $t; waitpid($pid, 0); exit($? >> 8);
              ' "$secs" "$@"
            }

            echo "=== Device inventory ==="
            xcrun simctl list devices    > "$DIAG_DIR/simctl-devices.txt"    2>&1 || true
            xcrun xctrace list devices   > "$DIAG_DIR/xctrace-devices.txt"   2>&1 || true
            xcodebuild -showsdks         > "$DIAG_DIR/showsdks.txt"          2>&1 || true

            echo "=== build.py output (status.txt, per-op logs, JUnit reports) ==="
            cp -R ./build "$DIAG_DIR/build" 2>/dev/null || true

            echo "=== Host CoreSimulator logs ==="
            cp -R "$HOME/Library/Logs/CoreSimulator" "$DIAG_DIR/CoreSimulator" 2>/dev/null || true

            echo "=== Host crash reports (test host / SurfBoard / CoreSimulator) ==="
            cp -R "$HOME/Library/Logs/DiagnosticReports" "$DIAG_DIR/DiagnosticReports" 2>/dev/null || true

            UDID="$(visionUDID)"
            if [ -n "$UDID" ]; then
              echo "=== Device-side unified log (bounded) for $UDID ==="
              run_bounded 180 xcrun simctl spawn "$UDID" log collect \
                --output "$DIAG_DIR/device-$UDID.logarchive" < /dev/null || true

              echo "=== Per-device simctl diagnose (bounded) ==="
              run_bounded 240 xcrun simctl diagnose -b \
                --output "$DIAG_DIR/simctl-diagnose" < /dev/null || true
            else
              echo "No visionUDID set; skipping device-side collection."
            fi

            echo "Collected diagnostics:"
            ls -laR "$DIAG_DIR" | head -200 || true

      - task: PublishBuildArtifacts@1
        condition: always()
        displayName: Publish visionOS diagnostics
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/visionos-diagnostics'
          ArtifactName: 'visionos-diagnostics'

      - task: Bash@3
        condition: always()
        displayName: Summarize test-runner result
        inputs:
          targetType: 'inline'
          script: |
            RC="$(visionTestRC)"
            echo "visionOS test-runner exit code: ${RC:-<unset>}"
            if [ "${RC}" = "124" ]; then
              echo "Outcome: HANG reproduced (wall-clock cap hit). See published 'visionos-diagnostics' artifact."
            elif [ "${RC}" = "0" ]; then
              echo "Outcome: tests PASSED. The host-launch hang did not reproduce this run."
            else
              echo "Outcome: tests FAILED fast (rc=${RC}). See published 'visionos-diagnostics' artifact for the real error."
            fi
