# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none # Non-PR branches
pr:
  branches:
    include:
    - '*'

parameters:
  - name: useAcesPool
    displayName: 'Run on the ACES shared pool (Sequoia). Disable to use the hosted macOS-14 image.'
    type: boolean
    default: false

variables:
- group: msal-ci-migration-vars
- name: xcodeVersion
  ${{ if eq(parameters.useAcesPool, true) }}:
    value: '16.4'
  ${{ else }}:
    value: '15.4'

resources:
 repositories:
   - repository: OneAuth
     type: git
     endpoint: 'OfficeAzureDevOps'
     name: OneAuth/OneAuth
     ref: dev

jobs:
- job: macOS_OnPrCommit
  displayName: OneAuth checks per commit for macOS
  timeoutInMinutes: 90
  cancelTimeoutInMinutes: 1
  pool:
    ${{ if eq(parameters.useAcesPool, true) }}:
      name: 'AcesShared'
      demands:
        - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    ${{ else }}:
      vmImage: 'macOS-14'
  workspace:
    clean: all

  steps:
  - checkout: self
    path: CommonCore
  - checkout: OneAuth
    path: s

  - task: UsePythonVersion@0
    displayName: 'Use Python 3.x'
  - script: |
     cd $(Agent.BuildDirectory)/CommonCore
     commit_number=$(git rev-parse HEAD)
     echo "##vso[task.setvariable variable=commit_number]$(git rev-parse HEAD)"
    displayName: 'Get latest commit number'

  - task: PythonScript@0
    displayName: Update subtree and rename files
    inputs:
     scriptPath: msal/scripts/update_msalobjc_subtree.py
     arguments: '--skip-checkout --msal-common-repo $(Agent.BuildDirectory)/CommonCore --remote-ref $(commit_number)'

  - task: UsePythonVersion@0
    displayName: 'Switch to use Xcode $(xcodeVersion)'
  - script: |
     /bin/bash -c "sudo xcode-select -s /Applications/Xcode_$(xcodeVersion).app"

  # Keep Apple signing assets aligned with the OneAuth macOS pipeline. Do not
  # use macos-setup.yml here: it supplies the legacy IDDP certificate password
  # outside the OneAuth project, while BudMacDevCert.p12 is installed without one.
  - template: msal/azure_pipelines/templates/download-labcert.yml@OneAuth

  - template: azure_pipelines/templates/setup-python.yml@OneAuth

  - task: InstallAppleCertificate@2
    displayName: 'Install code signing certificate'
    retryCountOnTaskFailure: 3
    inputs:
      certSecureFile: 'BudMacDevCert.p12'

  - task: PythonScript@0
    displayName: 'Detect UUID from Virtual Image'
    inputs:
      scriptPath: msal/scripts/check_pipelines_macos_uuid.py

  - task: InstallAppleProvisioningProfile@1
    displayName: 'Install an Apple provisioning profile'
    retryCountOnTaskFailure: 3
    inputs:
      provProfileSecureFile: 'Mac_Team_Provisioning_Profile.provisionprofile'

  - task: PythonScript@0
    name: Build
    displayName: 'Build x64 Debug macOS'
    inputs:
      scriptPath: msal/build.py
      arguments: '--clean --arch x64 --configuration Debug --platform macOS --djinni hashfail --test --test-type unit integration --build-projects tests'
    env:
      MSAL_LAB_VAULT_ACCESS_CERT_LOCATION: $(Agent.TempDirectory)
      MSAL_CERTIFICATE_PASSWORD: $(MSAL_CERTIFICATE_PASSWORD)
