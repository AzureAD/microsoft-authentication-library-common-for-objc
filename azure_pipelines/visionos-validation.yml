# Consolidated visionOS validation pipeline
# This pipeline runs all visionOS checks for IdentityCore, MSAL, and Broker in one place.
#
# Pool + Xcode + Ruby/Python tooling are provided by the shared governed ACES macOS
# job template (Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared). Each stage
# supplies only its own build steps via the template's `steps` parameter, so the pool,
# image and Xcode version are inherited from that single source of truth.

trigger:
  branches:
    include:
    - dev
    - main
    - release/*

resources:
  repositories:
  - repository: microsoft-authentication-library-for-objc
    type: github
    endpoint: 'MSAL ObjC Service Connection'
    name: AzureAD/microsoft-authentication-library-for-objc

  - repository: azure-activedirectory-tokenbroker-for-objc
    type: github
    endpoint: 'MSAL ObjC Service Connection'
    name: AzureAD/azure-activedirectory-tokenbroker-for-objc

  - repository: WorkplaceJoin-for-iOS
    type: github
    endpoint: 'MSAL ObjC Service Connection'
    name: AzureAD/WorkplaceJoin-for-iOS

  # Shared ACES macOS job template (pool + Xcode + tool setup) — source of truth.
  # TODO: switch ref to 'main' once ameyapat/common-aces-config is merged.
  - repository: pipelinesShared
    type: git
    name: IDDP/MSAL-ObjC-Pipelines
    ref: refs/heads/main

stages:
# Stage 1: IdentityCore visionOS validation
- stage: Stage_IdentityCore_VisionOS
  displayName: "IdentityCore visionOS"
  dependsOn: []
  jobs:
  - template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
    parameters:
      jobName: Validate_IdentityCore_VisionOS
      displayName: IdentityCore vision_library
      timeoutInMinutes: 60
      steps:
      - checkout: self
        clean: true
        submodules: true
        fetchDepth: 1
        persistCredentials: false
      - task: Bash@3
        displayName: Removing any lingering codecov files
        inputs:
          targetType: 'inline'
          script: |
            find . -name "*.gcda" -print0 | xargs -0 rm
      - template: /azure_pipelines/templates/download-visionos-sdk.yml
      - task: Bash@3
        displayName: Run CPP script
        inputs:
          targetType: 'inline'
          script: |
            python3 ./scripts/update_xcode_config_cpp_checks.py
          failOnStderr: true
      # ===================================================================
      # visionOS TEST-RUNNER DIAGNOSTICS  (branch-only — DO NOT MERGE TO DEV)
      # This IdentityCore stage intentionally re-enables the visionOS unit
      # tests to capture WHY the test host hangs on launch. Run it manually
      # by queueing this pipeline against the
      # mipetriu-visionos-test-diagnostics branch. Production visionOS
      # validation must stay build-only (./build.py --target vision_library).
      # ===================================================================
      - task: Bash@3
        displayName: Resolve & boot Apple Vision Pro simulator (blocking)
        inputs:
          targetType: 'inline'
          script: |
            set -uo pipefail
            echo "Available visionOS devices:"
            xcrun simctl list devices available | grep -i "Vision Pro" || true

            UDID=$(xcrun simctl list devices available \
              | grep -i "Apple Vision Pro" \
              | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}" \
              | head -1 || true)

            if [ -z "$UDID" ]; then
              echo "##[error]Could not resolve an available Apple Vision Pro simulator UDID." >&2
              exit 1
            fi
            echo "Resolved Apple Vision Pro UDID: $UDID"

            # Block until the device reports fully booted (or fail fast) instead of
            # the fire-and-forget boot build.py does.
            echo "Booting and waiting for boot to complete..."
            xcrun simctl bootstatus "$UDID" -b

            echo "Booted device state:"
            xcrun simctl list devices | grep -i "Apple Vision Pro" || true
            echo "##vso[task.setvariable variable=visionUDID]$UDID"
      - task: Bash@3
        displayName: Run visionOS tests (wall-clock bounded)
        inputs:
          targetType: 'inline'
          script: |
            set +e

            # Portable wall-clock timeout. GNU `timeout` is not guaranteed on the
            # macOS agent, so use perl (always present). It runs the command in its
            # OWN process group and, on expiry, signals the whole group so the child
            # xcodebuild is terminated too — not just build.py.
            run_bounded() {
              local secs="$1"; shift
              perl -e '
                my $t = shift @ARGV;
                my $pid = fork();
                if ($pid == 0) { setpgrp(0,0); exec @ARGV or die "exec failed: $!"; }
                local $SIG{ALRM} = sub { kill("-TERM", $pid); sleep 10; kill("-KILL", $pid); exit 124; };
                alarm $t; waitpid($pid, 0); exit($? >> 8);
              ' "$secs" "$@"
            }

            TEST_TIMEOUT=1200
            echo "Running: ./build.py --no-clean --target vision_library_test  (cap ${TEST_TIMEOUT}s)"
            run_bounded "$TEST_TIMEOUT" ./build.py --no-clean --target vision_library_test
            RC=$?

            if [ "$RC" -eq 124 ]; then
              echo "##[warning]visionOS test run hit the ${TEST_TIMEOUT}s wall-clock cap (host-launch hang reproduced)."
            else
              echo "visionOS test run exited with code ${RC}."
            fi

            # Never fail here — the diagnostics + publish steps must always run.
            echo "##vso[task.setvariable variable=visionTestRC]$RC"
            exit 0
      - task: Bash@3
        condition: always()
        displayName: Collect simulator & crash diagnostics
        inputs:
          targetType: 'inline'
          script: |
            set +e
            DIAG_DIR="$(Build.ArtifactStagingDirectory)/visionos-diagnostics"
            mkdir -p "$DIAG_DIR"

            run_bounded() {
              local secs="$1"; shift
              perl -e '
                my $t = shift @ARGV;
                my $pid = fork();
                if ($pid == 0) { setpgrp(0,0); exec @ARGV or die "exec failed: $!"; }
                local $SIG{ALRM} = sub { kill("-TERM", $pid); sleep 5; kill("-KILL", $pid); exit 124; };
                alarm $t; waitpid($pid, 0); exit($? >> 8);
              ' "$secs" "$@"
            }

            xcrun simctl list devices  > "$DIAG_DIR/simctl-devices.txt"  2>&1 || true
            xcrun xctrace list devices > "$DIAG_DIR/xctrace-devices.txt" 2>&1 || true
            xcodebuild -showsdks       > "$DIAG_DIR/showsdks.txt"        2>&1 || true

            # build.py output: status.txt, per-operation raw logs, JUnit reports.
            cp -R ./build "$DIAG_DIR/build" 2>/dev/null || true
            # Host-side simulator + crash logs (test host / SurfBoard / CoreSimulator).
            cp -R "$HOME/Library/Logs/CoreSimulator"    "$DIAG_DIR/CoreSimulator"    2>/dev/null || true
            cp -R "$HOME/Library/Logs/DiagnosticReports" "$DIAG_DIR/DiagnosticReports" 2>/dev/null || true

            UDID="$(visionUDID)"
            if [ -n "$UDID" ]; then
              run_bounded 180 xcrun simctl spawn "$UDID" log collect \
                --output "$DIAG_DIR/device-$UDID.logarchive" < /dev/null || true
              run_bounded 240 xcrun simctl diagnose -b \
                --output "$DIAG_DIR/simctl-diagnose" < /dev/null || true
            else
              echo "No visionUDID set; skipping device-side collection."
            fi

            echo "Collected diagnostics:"
            ls -laR "$DIAG_DIR" | head -200 || true
      - task: PublishBuildArtifacts@1
        condition: always()
        displayName: Publish visionOS diagnostics
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/visionos-diagnostics'
          ArtifactName: 'visionos-diagnostics'
      - task: Bash@3
        condition: always()
        displayName: Summarize test-runner result
        inputs:
          targetType: 'inline'
          script: |
            RC="$(visionTestRC)"
            echo "visionOS test-runner exit code: ${RC:-<unset>}"
            if [ "${RC}" = "124" ]; then
              echo "Outcome: HANG reproduced (wall-clock cap hit). See published 'visionos-diagnostics' artifact."
            elif [ "${RC}" = "0" ]; then
              echo "Outcome: tests PASSED. The host-launch hang did not reproduce this run."
            else
              echo "Outcome: tests FAILED fast (rc=${RC}). See published 'visionos-diagnostics' artifact for the real error."
            fi

# Stage 2: MSAL visionOS Framework validation
- stage: Stage_MSAL_VisionOS
  displayName: "MSAL visionOS"
  dependsOn: []
  jobs:
  - template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
    parameters:
      jobName: Validate_MSAL_VisionOS
      displayName: MSAL visionOSFramework
      timeoutInMinutes: 60
      steps:
      - template: /azure_pipelines/templates/download-visionos-sdk.yml
      - checkout: microsoft-authentication-library-for-objc
        displayName: 'Checkout MSAL'
        clean: true
        submodules: true
        fetchTags: true
        persistCredentials: true
      - checkout: self
        clean: true
        submodules: false
        fetchDepth: 1
        path: 's/microsoft-authentication-library-for-objc/MSAL/IdentityCore'
        persistCredentials: false
      - task: Bash@3
        displayName: Run Build script & check for Errors
        inputs:
          targetType: 'inline'
          script: |
            cd $(Agent.BuildDirectory)/s/microsoft-authentication-library-for-objc
            { output=$(./build.py --target visionOSFramework 2>&1 1>&3-) ;} 3>&1
            final_status=$(<./build/status.txt)
            echo "FINAL STATUS  = ${final_status}"
            echo "POSSIBLE ERRORS: ${output}"

            if [ $final_status != "0" ]; then
              echo "Build Failed! \n ${output}" >&2
            fi
          failOnStderr: true
      - task: Bash@3
        condition: always()
        displayName: Cleanup
        inputs:
          targetType: 'inline'
          script: |
            rm -rf $(Agent.BuildDirectory)/s/microsoft-authentication-library-for-objc/build/status.txt

# Stage 3: Broker visionOS validation
- stage: Stage_Broker_VisionOS
  displayName: "Broker visionOS"
  dependsOn: []
  jobs:
  - template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
    parameters:
      jobName: Validate_Broker_VisionOS
      displayName: Broker vision_library
      timeoutInMinutes: 60
      steps:
      - template: /azure_pipelines/templates/download-visionos-sdk.yml
      # Repo checkouts, submodules and build. Xcode is inherited from the shared
      # ACES job template, so selectLocalXcode is false.
      - template: /azure_pipelines/broker_build_steps.yml
        parameters:
          target: vision_library
          selectLocalXcode: false
